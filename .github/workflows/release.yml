name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # The bundled script targets Windows (e.g. $env:LOCALAPPDATA defaults), so smoke test there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build bundled script
        shell: pwsh
        run: ./build/New-Bundle.ps1 -Version '${{ github.ref_name }}' -OutputPath dist/eclipsADT-o-mat.ps1

      - name: Smoke test bundled scripts
        shell: pwsh
        env:
          ECLIPSADT_NO_PAUSE: '1'
        run: |
          ./dist/eclipsADT-o-mat.ps1 -ListFeatures
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "dist\eclipsADT-o-mat.cmd -ListFeatures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: dist/RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}'
          'dist/eclipsADT-o-mat.cmd'
          'dist/eclipsADT-o-mat.ps1'
          --title '${{ github.ref_name }}'
          --notes-file 'dist/RELEASE_NOTES.md'
