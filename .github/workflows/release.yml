name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build bundled script
        shell: pwsh
        run: ./build/New-Bundle.ps1 -Version '${{ github.ref_name }}' -OutputPath dist/eclipsADT-o-mat.ps1

      - name: Smoke test bundled script
        shell: pwsh
        run: |
          ./dist/eclipsADT-o-mat.ps1 -ListFeatures
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}'
          'dist/eclipsADT-o-mat.ps1'
          --title '${{ github.ref_name }}'
          --generate-notes
