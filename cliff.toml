# git-cliff configuration (https://git-cliff.org/docs/configuration)

[changelog]
# template for the changelog body of a single release
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/stockbal/eclipsADT-o-mat/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full Changelog:** [{{ previous.version }}...{{ version }}](https://github.com/stockbal/eclipsADT-o-mat/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# regex to preprocess commit messages
commit_preprocessors = [
  # link issue/PR references like (#42)
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/stockbal/eclipsADT-o-mat/issues/${2}))" },
]
# map commit types to changelog sections (order defines section order)
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🔨 Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->🏗️ Build & CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->🧹 Chores" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
